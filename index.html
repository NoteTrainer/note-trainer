<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Note Trainer V36A - Web Version</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#111}
body{min-height:100vh;display:block;width:100%;}
.app{width:100%;max-width:none;min-height:100vh;background:#fff;padding:12px}
h1{text-align:center;font-size:28px;margin:4px 0 6px}
#status{text-align:center;font-weight:bold;font-size:18px;min-height:25px}
.center{text-align:center}
.big{font-size:92px;font-weight:bold;margin:18px 0}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:10px;background:#222;color:#fff;font-size:20px;font-weight:bold}
button:disabled{opacity:.45}
.staffbox{border:2px solid #222;border-radius:10px;background:white;padding:4px}
svg{display:block;width:100%;height:auto}
#result{font-size:22px;font-weight:bold;text-align:center;min-height:32px;margin:7px 0}
#heard{text-align:center;font-size:16px;min-height:24px}
.small{text-align:center;color:#555;font-size:14px;margin:8px 4px;line-height:1.35}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<h1>NOTE TRAINER</h1>
<div id="status">Ready</div>

<div id="setup" class="center">
  <div style="font-size:21px;font-weight:bold">VOICE SETUP</div>
  <div class="small">Allow the microphone once. Then say each letter when it appears.</div>
  <div id="setupLetter" class="big">A</div>
  <button id="setupButton">START VOICE SETUP</button>
  <div id="setupHeard"></div>
</div>

<div id="trainer" class="hidden">
  <div class="staffbox">
    <svg id="grand" viewBox="0 0 700 620"></svg>
  </div>
  <div id="debugNote" style="text-align:center;font-size:28px;font-weight:bold;margin:6px 0;">PROGRAM NOTE: —</div>
   <div id="result">Voice setup complete.</div>
  <div id="heard"></div>
  <button id="trainButton">START TRAINING</button>
  <button id="againButton" class="hidden">LISTEN AGAIN</button>
</div>
</div>

<script>
(function(){
"use strict";

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var recognition=null;
var micStream=null;
var mode="setup";
var setupIndex=0;
var current=null;
var listening=false;
var shouldListen=false;
var lastAnswerTime=0;
var processingAnswer=false;

var letters=["A","B","C","D","E","F","G"];

var setup=document.getElementById("setup");
var trainer=document.getElementById("trainer");
var setupLetter=document.getElementById("setupLetter");
var setupButton=document.getElementById("setupButton");
var setupHeard=document.getElementById("setupHeard");
var status=document.getElementById("status");
var result=document.getElementById("result");
var heard=document.getElementById("heard");
var trainButton=document.getElementById("trainButton");
var againButton=document.getElementById("againButton");
var grand=document.getElementById("grand");
var debugNote=document.getElementById("debugNote");

function speak(t, done){
  if(!window.speechSynthesis){
    if(done)done();
    return;
  }
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  u.rate=.9;
  u.onend=function(){if(done)done();};
  u.onerror=function(){if(done)done();};
  speechSynthesis.speak(u);
}

function setStatus(t){status.textContent=t}

function recognizedLetter(alts){
  const forms={
    A:["a","ay","aye"],
    B:["b","bee","be"],
    C:["c","cee","sea","see"],
    D:["d","dee","de"],
    E:["e","ee"],
    F:["f","eff","of","off"],
    G:["g","gee"]
  };
  for(const alt of (alts||[])){
    const s=String(alt).toLowerCase().trim().replace(/[^a-z]/g,"");
    if(s==="c"||s==="cee"||s==="see"||s==="sea")return "C";
    for(const letter of Object.keys(forms)){
      if(forms[letter].includes(s))return letter;
    }
  }
  return null;
}

function buildRecognition(){
  if(!SR){
    setStatus("Speech recognition is not supported");
    result.textContent="Please use Chrome on a supported device.";
    return false;
  }
  if(recognition)return true;

  recognition=new SR();
  recognition.lang="en-US";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=5;

  recognition.onstart=function(){
    listening=true;
    setStatus("Listening...");
  };

  recognition.onresult=function(e){
    if(!e.results||!e.results.length)return;
    var r=e.results[e.results.length-1];
    if(!r.isFinal)return;

    var heardFinal=(r[0]&&r[0].transcript?r[0].transcript.trim():"");
    if(!heardFinal)return;

    var matched=recognizedLetter([heardFinal]);
    if(!matched){
      for(var j=1;j<r.length;j++){
        var candidate=recognizedLetter([r[j].transcript.trim()]);
        if(candidate){matched=candidate;break;}
      }
    }

    // Stop listening BEFORE speaking any feedback.
    shouldListen=false;
    try{recognition.stop();}catch(e){}
    process(heardFinal,matched);
  };

  recognition.onerror=function(e){
    listening=false;
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      shouldListen=false;
      setStatus("Microphone permission needed");
      result.textContent="Microphone access was not allowed.";
      setupHeard.textContent="Tap START VOICE SETUP and choose Allow.";
      setupButton.disabled=false;
    }else if(e.error==="no-speech"){
      setStatus("No speech heard");
      if(mode==="setup"){
        setupHeard.textContent="I didn't hear you. Say "+letters[setupIndex]+".";
        setTimeout(function(){if(shouldListen)startRecognition();},250);
      }else if(mode==="training"){
        result.textContent="I didn't hear a note.";
        setTimeout(function(){if(shouldListen)startRecognition();},250);
      }
    }else{
      setStatus("Microphone error");
      if(mode==="setup")setupButton.disabled=false;
    }
  };

  recognition.onend=function(){
    listening=false;
    if(shouldListen){
      setTimeout(function(){
        if(shouldListen&&!listening)startRecognition();
      },200);
    }
  };
  return true;
}

function startRecognition(){
  if(!recognition||listening)return;
  try{recognition.start();}catch(e){}
}

function stopRecognition(){
  shouldListen=false;
  if(recognition&&listening){
    try{recognition.stop();}catch(e){}
  }
}

function process(text,recognized){
  var answer=recognized||null;
  var now=Date.now();
  if(now-lastAnswerTime<700)return;

  if(mode==="setup"){
    var expected=letters[setupIndex];
    lastAnswerTime=now;
    setupHeard.textContent="Heard: "+text+"  →  saved as "+expected;
    setupIndex++;

    if(setupIndex===letters.length){
      mode="ready";
      shouldListen=false;
      setup.classList.add("hidden");
      trainer.classList.remove("hidden");
      setStatus("Voice setup complete");
      result.textContent="Voice setup complete.";
      speak("Voice setup is complete.");
    }else{
      setupLetter.textContent=letters[setupIndex];
      setupHeard.textContent="Saved. Now say "+letters[setupIndex]+".";
      setTimeout(function(){
        if(mode==="setup"){
          shouldListen=true;
          startRecognition();
        }
      },250);
    }
    return;
  }

  if(mode!=="training")return;

  heard.textContent="Heard: "+text+(answer?" → "+answer:"");

  if(answer===current.letter){
    lastAnswerTime=now;
    processingAnswer=true;
    shouldListen=false;
    result.textContent="✓ Correct!";
    setStatus("Correct");
    speak("Correct",function(){
      processingAnswer=false;
      setTimeout(newNote,250);
    });
  }else if(answer){
    processingAnswer=true;
    shouldListen=false;
    result.textContent="Try again.";
    setStatus("Not quite");
    speak("Try again.",function(){
      processingAnswer=false;
      setTimeout(function(){
        if(mode==="training"){
          shouldListen=true;
          startRecognition();
        }
      },250);
    });
  }
}

 C5:122.5,D5:115,E5:107.5,F5:100
};
var bass={

 G3:197.5,A3:190,B3:182.5,C4:175
};

var notes=[
"C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5",
"G2","A2","B2","C3","D3","E3","F3","G3","A3","B3","C4"
];

function el(n){return document.createElementNS("http://www.w3.org/2000/svg",n)}

function line(x1,y1,x2,y2,w){
 var e=el("line");
 e.setAttribute("x1",x1);e.setAttribute("y1",y1);
 e.setAttribute("x2",x2);e.setAttribute("y2",y2);
 e.setAttribute("stroke","#111");e.setAttribute("stroke-width",w||3);
 grand.appendChild(e);
}

function text(x,y,t,size){
 var e=el("text");
 e.setAttribute("x",x);e.setAttribute("y",y);
 e.setAttribute("font-family","serif");e.setAttribute("font-size",size);
 e.textContent=t;grand.appendChild(e);
}

function addRefImage(href,x,y,w,h){
 var im=el("image");
 im.setAttribute("href",href);
 im.setAttribute("x",x);im.setAttribute("y",y);
 im.setAttribute("width",w);im.setAttribute("height",h);
 im.setAttribute("preserveAspectRatio","none");
 grand.appendChild(im);
}

function staff(clef,note){
 var map=clef==="treble"?treble:bass;
 var ys=clef==="treble"?[100,115,130,145,160]:[190,205,220,235,250];

 for(var i=0;i<5;i++)line(75,ys[i],660,ys[i],3);

 // These clef shapes are taken directly from the user's supplied reference
 // image, so their proportions and appearance match the requested example.
 if(clef==="treble"){
   addRefImage(TREBLE_REF,78,82,60,132);
 }else{
   addRefImage(BASS_REF,78,180,69,91);
 }

 if(!note)return;

 var y=map[note],x=390;
 if(y===undefined)return;

 // Ledger line for middle C only.
 if(note==="C4") line(x-32,175,x+32,175,3);

 // Extra ledger lines for notes outside the staff.
 if(clef==="treble"){
   if(y<100)for(var a=85;a>=y-2;a-=15)line(x-32,a,x+32,a,3);
 }else{
   if(y>250)for(var b=265;b<=y+2;b+=15)line(x-32,b,x+32,b,3);
 }

 var n=el("ellipse");
 n.setAttribute("cx",x);n.setAttribute("cy",y);
 n.setAttribute("rx",22);n.setAttribute("ry",15);
 n.setAttribute("fill","#111");
 n.setAttribute("transform","rotate(-20 "+x+" "+y+")");
 grand.appendChild(n);

 var up=(clef==="treble"?y<=130:y>=205);
 var sx=up?x-20:x+20;
 line(sx,y,sx,up?y+78:y-78,4);
}

function draw(){
 while(grand.firstChild)grand.removeChild(grand.firstChild);
 staff("treble",current&&current.clef==="treble"?current.name:null);
 staff("bass",current&&current.clef==="bass"?current.name:null);
}

function newNote(){
 var n;
 do{
   n=notes[Math.floor(Math.random()*notes.length)];
 }while(current&&n===current.name);

 current={
   name:n,
   letter:n.charAt(0),
   clef:treble[n]!==undefined?"treble":"bass"
 };
 debugNote.textContent="PROGRAM NOTE: "+current.letter+" ("+current.name+")";
 draw();
 result.textContent="Say the note.";
 heard.textContent="";
 setStatus("Listening...");
}

/*
  The ONLY explicit permission-triggering action is recognition.start()
  from the user's Start Voice Setup click. There is no getUserMedia call
  anywhere in the program.
*/
setupButton.onclick=function(){
  if(!buildRecognition())return;
  setupButton.disabled=true;
  mode="setup";
  setupIndex=0;
  setupLetter.textContent="A";
  setupHeard.textContent="Starting microphone…";
  setStatus("Starting microphone...");
  shouldListen=true;
  startRecognition();
};

trainButton.onclick=function(){
  if(!buildRecognition())return;
  mode="training";
  trainButton.classList.add("hidden");
  againButton.classList.remove("hidden");
  stopRecognition();
  speak("Look at the note and say its name.",function(){
    setTimeout(function(){
      if(mode==="training"){
        newNote();
        shouldListen=true;
        startRecognition();
      }
    },200);
  });
};

againButton.onclick=function(){
  if(mode!=="training")return;
  stopRecognition();
  result.textContent="Listening...";
  heard.textContent="";
  setTimeout(function(){
    shouldListen=true;
    startRecognition();
  },200);
};

})();
</script>
